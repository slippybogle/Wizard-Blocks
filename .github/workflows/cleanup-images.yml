name: cleanup-images

# Deletes every image version in ghcr.io/fladnagmai/wizard-blocks except the
# one tagged KEEP (its multi-arch index and platform manifests are kept).
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tag to keep"
        required: true
        default: "0.1.4-alpha"

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ github.event.inputs.keep }}
        run: |
          set -euo pipefail
          img="ghcr.io/fladnagmai/wizard-blocks:${KEEP}"
          index=$(docker buildx imagetools inspect "$img" --format '{{json .Manifest}}' | jq -r .digest)
          children=$(docker buildx imagetools inspect --raw "$img" | jq -r '.manifests[].digest')
          [ -n "$index" ] && [ -n "$children" ] || { echo "cannot resolve $img"; exit 1; }
          keep=" $index $(echo $children) "
          echo "keeping: $keep"
          base="https://api.github.com/users/fladnagmai/packages/container/wizard-blocks/versions"
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          api "$base?per_page=100" | jq -r '.[] | "\(.id) \(.name) \(.metadata.container.tags | join(","))"' |
          while read -r id name tags; do
            case "$keep" in
              *" $name "*) echo "keep   $name ${tags:-}";;
              *) echo "delete $name ${tags:-}"; api -X DELETE "$base/$id";;
            esac
          done
