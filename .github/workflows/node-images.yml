name: node-images

# Builds the Litecoin Node and Dogecoin Node images (amd64 + arm64) from the
# official release binaries (checksums and signatures are verified inside
# the build, see nodes/*/Dockerfile) and pushes them to
# ghcr.io/fladnagmai/litecoin-node:<version> and dogecoin-node:<version>.
on:
  push:
    branches: [node-apps]
    paths: ["nodes/**", ".github/workflows/node-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: litecoin-node
            dir: nodes/litecoin
            version: 0.21.5.8
          - name: dogecoin-node
            dir: nodes/dogecoin
            version: 1.14.9
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ matrix.version }}
          tags: ghcr.io/fladnagmai/${{ matrix.name }}:${{ matrix.version }}
          labels: org.opencontainers.image.source=https://github.com/fladnagmai/Wizard-Blocks
      - name: Digest to pin
        run: echo "ghcr.io/fladnagmai/${{ matrix.name }}:${{ matrix.version }}@${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
