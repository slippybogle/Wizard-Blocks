# BCH TESTNET stack: Bitcoin Cash Node on chipnet (default) or testnet4,
# plus the Wizard-Blocks engine pointed at it. Separate from the mainnet
# setup (../docker-compose.umbrel.yml): own project name, data, and ports.
#
#   cp .env.example .env   # then edit
#   docker compose up -d --build
#
# See README.md in this directory for the full Umbrel walkthrough.
name: wizard-blocks-bch-testnet

services:
  bchn:
    image: zquestz/bitcoin-cash-node:29.2.0
    restart: unless-stopped
    stop_grace_period: 120s
    command:
      - bitcoind
      - -${BCH_NETWORK:-chipnet}            # chipnet | testnet4
      - -server=1
      - -rpcuser=${RPC_USER:?set RPC_USER in .env}
      - -rpcpassword=${RPC_PASSWORD:?set RPC_PASSWORD in .env}
      - -rpcport=18332
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0                # only reachable on the compose network
      - -zmqpubhashblock=tcp://0.0.0.0:28332
      - -dbcache=${BCHN_DBCACHE_MB:-450}
      - -prune=${BCHN_PRUNE_MB:-0}           # 0 = keep full chain; >= 550 enables pruning
      - -printtoconsole=1
    volumes:
      - bchn-data:/home/bitcoin/.bitcoin
    # No RPC/ZMQ ports are published: only the engine talks to the node.

  engine:
    build: ../..
    image: wizard-blocks:local
    restart: unless-stopped
    stop_grace_period: 90s                   # let an in-flight block submission finish
    depends_on: [bchn]
    environment:
      WB_COIN: bch
      WB_RPC_URL: http://bchn:18332
      WB_RPC_USER: ${RPC_USER}
      WB_RPC_PASSWORD: ${RPC_PASSWORD}
      WB_ZMQ_HASHBLOCK: tcp://bchn:28332
      WB_PAYOUT_MODE: ${PAYOUT_MODE:-fixed}
      WB_PAYOUT_ADDRESS: ${PAYOUT_ADDRESS:-}
      WB_COINBASE_TAG: /wizard-blocks-testnet/
      WB_VARDIFF_INITIAL: ${VARDIFF_INITIAL:-512}
      WB_LOG_LEVEL: ${LOG_LEVEL:-info}
      WB_LOG_FORMAT: text
    ports:
      - "${STRATUM_PORT:-3335}:3333"           # miners on your LAN
      - "127.0.0.1:${API_PORT:-8090}:8080"     # stats JSON / metrics (local only)
    volumes:
      - engine-data:/data

volumes:
  bchn-data:     # chain data (docker volume: wizard-blocks-bch-testnet_bchn-data)
  engine-data:   # found blocks / best share
