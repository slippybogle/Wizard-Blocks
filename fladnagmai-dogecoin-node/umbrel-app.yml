category: bitcoin
name: Dogecoin Node
version: "1.14.9-wb1"
tagline: A pruned Dogecoin Core node for merged mining
icon: https://raw.githubusercontent.com/fladnagmai/Wizard-Blocks/main/fladnagmai-dogecoin-node/icon.svg
description: >-
  Dogecoin Core v1.14.9, built from the official release binaries (the build checks
  the release signature from dogecoin1 and the checksum). Pruned to about 2 GB
  of blocks, txindex off, with memory settings sized for a shared Umbrel
  (dbcache=200 MiB, maxmempool=100 MiB, 24 peers).


  It exports its RPC and ZMQ details for Wizard-Blocks-LTC. The first sync
  downloads the whole chain once even though it is pruned; on a home
  connection that takes days. Sync one node at a time.
releaseNotes: >-
  First release.
