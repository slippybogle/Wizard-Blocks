category: bitcoin
name: Litecoin Node
version: "0.21.5.8-wb1"
tagline: A pruned Litecoin Core node for merged mining
icon: https://raw.githubusercontent.com/fladnagmai/Wizard-Blocks/main/fladnagmai-litecoin-node/icon.svg
description: >-
  Litecoin Core v0.21.5.8, built from the official release binaries (the build checks
  the release signature from litecoin1 and the checksum). Pruned to about 2 GB
  of blocks, txindex off, with memory settings sized for a shared Umbrel
  (dbcache=300 MiB, maxmempool=100 MiB, 24 peers).


  It exports its RPC and ZMQ details for Wizard-Blocks-LTC. The first sync
  downloads the whole chain once even though it is pruned; on a home
  connection that takes days. Sync one node at a time.
releaseNotes: >-
  First release.
