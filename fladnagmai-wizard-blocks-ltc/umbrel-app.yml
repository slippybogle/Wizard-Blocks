category: crypto
name: Wizard-Blocks-LTC (test)
version: "0.2.0-test1"
tagline: Solo-mine Litecoin and merge-mine Dogecoin on your own nodes (test build)
icon: https://raw.githubusercontent.com/fladnagmai/Wizard-Blocks/main/fladnagmai-wizard-blocks-ltc/icon.svg
description: >-
  TEST BUILD. Wizard-Blocks-LTC is a self-hosted solo-mining Stratum V1
  server for Litecoin with Dogecoin merged mining: every share is checked
  against both chains, so one Scrypt miner mines LTC and DOGE at once. It
  talks to your Litecoin Node and Dogecoin Node apps over RPC and ZMQ, and
  100% of every block reward goes to your own payout addresses.


  Point your Scrypt miner (e.g. Elphapex DG Home 1) at umbrel.local:50333.
  The web UI is one stats page for both chains: engine, both nodes, chains,
  job, pool, miners and blocks.


  On first run, open the app and set your LTC payout address (and a DOGE
  address to also mine Dogecoin); your nodes check them. No work is issued
  to miners until the LTC address is set.


  Not yet checked against a real mainnet MWEB block: use for testing.
